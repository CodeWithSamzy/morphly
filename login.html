<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f1" />
    <meta name="robots" content="noindex" />
    <title>Morphly - private access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="login.js" defer></script>
    <style>
      :root { --paper: #f4f5f1; --ink: #202523; --muted: #727b76; --line: #dfe3de; --forest: #286b52; --forest-dark: #1d513e; --coral: #e6775b; --mono: "DM Mono", "Courier New", monospace; --display: "Manrope", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; }
      .gate { width: 100%; max-width: 400px; padding: 38px 34px 34px; background: #fff; border: 1px solid #d9ded8; box-shadow: 0 12px 36px rgb(31 45 37 / 6%); }
      .brand { display: inline-flex; align-items: center; gap: 10px; font: 800 19px var(--display); }
      .brand-mark { width: 25px; height: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; transform: rotate(-8deg); }
      .brand-mark span:first-child { background: var(--forest); border-radius: 7px 2px 2px 2px; }
      .brand-mark span:last-child { background: var(--coral); border-radius: 2px 7px 2px 2px; margin-top: 5px; }
      .eyebrow { margin: 26px 0 12px; font: 500 10px var(--mono); color: var(--forest); }
      h1 { margin: 0; font: 700 30px/1.1 var(--display); }
      .hint { margin: 10px 0 26px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      label { display: block; margin-bottom: 8px; font: 500 10px var(--mono); color: var(--muted); }
      input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 3px; background: #fbfcfa; font: 400 15px var(--display); color: var(--ink); }
      input:focus-visible, button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
      button { width: 100%; height: 46px; margin-top: 16px; border: 0; border-radius: 3px; background: var(--forest); color: #fff; font: 600 14px var(--display); cursor: pointer; transition: background .18s; }
      button:hover:not(:disabled) { background: var(--forest-dark); }
      button:disabled { opacity: .6; cursor: progress; }
      .status { min-height: 18px; margin: 14px 0 0; font: 12px var(--mono); color: var(--muted); }
      .status.error { color: #b0432a; }
      .footnote { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font: 10px var(--mono); color: #8a928d; }
    </style>
  </head>
  <body>
    <main class="gate">
      <span class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span>Morphly</span>
      <p class="eyebrow">PRIVATE ACCESS</p>
      <h1>This studio is locked.</h1>
      <p class="hint">Morphly is set up for personal use. Enter the access password to continue.</p>
      <form id="login-form">
        <label for="password">PASSWORD</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit" id="submit-button">Unlock</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="footnote">Only people with the password can use this deployment and spend its Cloudflare AI allowance.</p>
    </main>
  </body>
</html>
